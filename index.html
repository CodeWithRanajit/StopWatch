<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js"></script> 
</head>
<body>
<div class="container">
    <div class="timerss">
        <h1 id="displaytime">00 : 00 : 00</h1>
    </div>
    <div class="timers">
     <span class="times">Hours</span>
     <span class="times">Minutes</span>
     <span class="times">Seconds</span>
    </div>
    <div class="button">
        <span class="starts" oneclick="watchStart()">Start</span>
        <span class="starts-stop" oneclick="watchStop()">Stop</span>
        <span class="starts-reset" oneclick="watchReset()">Reset</span>
    </div>
</div>
</body>
</html>
